name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal package
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Minimal import test
        run: python -c "from gentis_ai import Expert, Router, Flow; print(Expert(name='support', description='x').system_prompt)"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check gentis_ai tests examples --select F
      - name: Mypy
        run: mypy gentis_ai/core gentis_ai/routing gentis_ai/memory gentis_ai/runtime --ignore-missing-imports --follow-imports=skip --no-incremental
      - name: Tests
        run: python -m pytest
      - name: Offline eval
        run: gentis eval
      - name: Build
        run: python -m build
