[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gentis-ai"
version = "0.2.0"
description = "A lightweight package for multi-expert AI agent routing and state management."
authors = [
  { name="GhaouiYoussef", email="youssefghaoui.pro@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3.0"]
openai = ["openai>=1.0.0"]
azure = ["openai>=1.0.0"]
bedrock = ["boto3>=1.34.0"]
ollama = ["ollama>=0.1.0"]
vllm = ["openai>=1.0.0"]
langgraph = ["langgraph>=1.2,<2"]
bench = [
    "crewai",
    "langchain-google-genai",
    "python-dotenv>=1.2.2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]
all = [
    "google-genai>=0.3.0",
    "openai>=1.0.0",
    "boto3>=1.34.0",
    "ollama>=0.1.0",
    "langgraph>=1.2,<2",
]

[project.scripts]
gentis = "gentis_ai.cli:main"

[project.urls]
"Homepage" = "https://github.com/GhaouiYoussef/GentisAI"

[tool.setuptools.packages.find]
include = ["gentis_ai*"]
exclude = ["test_init_project*", "tests*"]

[tool.setuptools.package-data]
"gentis_ai" = ["prompts/**/*", "templates/**/*"]
